<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="gx - grep xargs sed awk">
  <defs>
    <!-- Reuse the logo-ocean hexagon outline as our main mark. -->
    <clipPath id="hex">
      <path d="M100 30 L160 65 L160 135 L100 170 L40 135 L40 65Z"/>
    </clipPath>
  </defs>

  <!-- main mark: ocean-blue hexagonal cube, three faces -->
  <g clip-path="url(#hex)" transform="translate(0,10)">
    <!-- top face -->
    <path d="M100 30 L160 65 L100 100 L40 65Z" fill="#01579B"/>
    <!-- left face -->
    <path d="M40 65 L100 100 L100 170 L40 135Z" fill="#003C71"/>
    <!-- right face -->
    <path d="M160 65 L100 100 L100 170 L160 135Z" fill="#0277BD"/>

    <!-- subtle iso grid lines, like the original -->
    <g stroke="#003C71" stroke-width="0.8" opacity="0.4">
      <line x1="100" y1="30" x2="100" y2="100"/>
      <line x1="40"  y1="65" x2="100" y2="100"/>
      <line x1="160" y1="65" x2="100" y2="100"/>
      <line x1="100" y1="100" x2="100" y2="170"/>
      <line x1="70"  y1="83" x2="130" y2="152"/>
      <line x1="130" y1="83" x2="70"  y2="152"/>
    </g>

    <!-- light-blue highlight wedges echoing the source -->
    <path d="M70 47 L100 65 L100 30Z" fill="#B3E5FC" opacity="0.95"/>
    <path d="M130 117 L160 135 L160 100Z" fill="#B3E5FC" opacity="0.9"/>
    <path d="M70 135 L100 152 L70 152Z" fill="#B3E5FC" opacity="0.85"/>
  </g>
  <!-- hexagon outline -->
  <path d="M100 30 L160 65 L160 135 L100 170 L40 135 L40 65Z"
        fill="none" stroke="#003C71" stroke-width="2"/>

  <!-- "gx" wordmark, monospace, carved onto the cube face -->
  <text x="100" y="118"
        text-anchor="middle"
        font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace"
        font-size="44" font-weight="700" letter-spacing="-2"
        fill="#E1F5FE">gx</text>

  <!-- tagline to the right of the mark -->
  <text x="200" y="92"
        font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace"
        font-size="56" font-weight="700" letter-spacing="-2"
        fill="#01579B">gx</text>

  <text x="200" y="125"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="20" font-weight="500" letter-spacing="2"
        fill="#0277BD">grep · xargs · sed · awk</text>

  <text x="200" y="155"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="14" font-weight="400" letter-spacing="0.5"
        fill="#475569">a handy text-processing utility</text>
</svg>
